    <rect x="306" width="130" height="66" rx="14" fill="#181a33" stroke="#7885ff" stroke-width="3"/>
    <rect x="459" width="130" height="66" rx="14" fill="#181a33" stroke="#55d6ff" stroke-width="3"/>
    <g fill="#e5d7ff" opacity=".9">
      <circle cx="20" cy="20" r="5"/><circle cx="173" cy="20" r="5"/>
      <circle cx="326" cy="20" r="5"/><circle cx="479" cy="20" r="5"/>
