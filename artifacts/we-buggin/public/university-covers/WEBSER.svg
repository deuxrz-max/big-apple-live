<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Web Series</title>
  <desc id="desc">A glowing storybook screen with episode cards beneath it, against a midnight violet sky.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111127"/>
      <stop offset=".58" stop-color="#291440"/>
      <stop offset="1" stop-color="#101c3d"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff50c8"/>
      <stop offset=".52" stop-color="#9a63ff"/>
      <stop offset="1" stop-color="#43d8ff"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#48226b"/>
      <stop offset="1" stop-color="#18284a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="500" rx="34" fill="url(#bg)"/>
