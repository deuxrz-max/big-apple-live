  </g>
  <g filter="url(#glow)" opacity=".62">
    <rect x="147" y="65" width="506" height="272" rx="28" fill="none" stroke="url(#edge)" stroke-width="12"/>
  </g>
  <rect x="147" y="65" width="506" height="272" rx="28" fill="#101326" stroke="url(#edge)" stroke-width="8"/>
  <rect x="164" y="82" width="472" height="238" rx="18" fill="url(#screen)"/>
  <path d="M164 259c76-66 151-66 232-3s155 45 240-27v91H164z" fill="#69377e" opacity=".35"/>
  <path d="M196 259c38-31 77-31 115 0s76 31 115 0 77-31 115 0 70 27 95 10" fill="none" stroke="#ff77d8" stroke-width="5" opacity=".75"/>
  <circle cx="400" cy="194" r="46" fill="#11132b" stroke="#d8b8ff" stroke-width="3"/>
  <path d="m387 168 43 26-43 26z" fill="#c5a2ff"/>
  <g transform="translate(173 365)">
