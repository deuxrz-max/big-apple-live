kind = "web"
previewPath = "/legacy-big-apple/"
title = "Big Apple Live"
description = "Adults-only social chat universities with uploaded profile photos, saved messages and independent atmosphere."
version = "1.0.0"
id = "artifacts/we-buggin"
router = "path"

[[services]]
name = "web"
paths = [ "/legacy-big-apple/" ]
localPort = 24150

[services.development]
run = "pnpm --filter @workspace/we-buggin run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/we-buggin", "run", "build" ]
serve = "static"
publicDir = "artifacts/we-buggin/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24150"
BASE_PATH = "/legacy-big-apple/"
