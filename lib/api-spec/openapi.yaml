  /me:
    get:
      operationId: getMyProfile
      tags: [identity]
      security: [{ AccountSession: [] }]
      responses:
        "200":
          description: Saved account identity or null before onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
    put:
      operationId: saveMyProfile
      tags: [identity]
      security: [{ AccountSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved dedicated name and identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "409":
          description: Dedicated name already taken or cannot be renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /emojis:
    get:
      operationId: getEmojiCatalog
      tags: [identity]
      responses:
        "200":
          description: OpenMoji emoji library, with searchable names and categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmojiOption" }
  /emojis/{emojiId}/{color}/image:
    get:
      operationId: getEmojiImage
      tags: [identity]
      parameters:
        - name: emojiId
          in: path
          required: true
          schema: { type: string }
        - name: color
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{6}$" }
      responses:
        "200":
          description: Static library SVG with custom color, never driven by audio
          content:
            image/svg+xml:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          description: Unknown emoji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /social/chess/rooms:
    post:
      operationId: createChessRoom
      tags: [chess]
      responses:
        "201":
          description: A private two-player audio-only chess room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChessRoomState" }
  /social/chess/rooms/{chessRoomId}:
    get:
      operationId: getChessRoom
      tags: [chess]
      parameters:
        - { name: chessRoomId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Authoritative board and legal moves for this player
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChessRoomState" }
  /social/chess/rooms/{chessRoomId}/join:
    post:
      operationId: joinChessRoom
      tags: [chess]
      parameters:
        - { name: chessRoomId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Join or reconnect to one of exactly two player places
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChessRoomState" }
  /social/chess/rooms/{chessRoomId}/actions:
    post:
      operationId: actChessRoom
      tags: [chess]
      parameters:
        - { name: chessRoomId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChessActionInput" }
      responses:
        "200":
          description: Validated move or game action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChessRoomState" }
  /social/chess/rooms/{chessRoomId}/audio:
    post:
      operationId: connectChessAudio
      tags: [chess]
      parameters:
        - { name: chessRoomId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Participant-only microphone token, never camera permission
          content:
            application/json:
              schema:
                type: object
                required: [url, token]
                properties:
                  url: { type: string }
                  token: { type: string }
  /account/rooms:
    post:
      operationId: createAccountRoom
      tags: [identity, rooms]
      security: [{ AccountSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRoomInput" }
      responses:
        "201":
          description: Room joined using the authenticated account's saved identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSession" }
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "409":
          description: Complete identity signup before joining
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms/{roomId}/join:
    post:
      operationId: joinAccountRoom
      tags: [identity, rooms]
      security: [{ AccountSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "201":
          description: Participant joined using their own saved account identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSession" }
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "404":
          description: Room not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Profile incomplete or room full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/rooms/{roomId}/messages:
    get:
      operationId: getRoomMessages
      tags: [rooms]
      security: [{ AccountSession: [], AccountRoomSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RoomSessionHeader"
      responses:
        "200":
          description: Last 60 accepted messages, ordered oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: sendRoomMessage
      tags: [rooms]
      security: [{ AccountSession: [], AccountRoomSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RoomSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "201":
          description: Accepted message and authoritative sender profile, committed together
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccepted" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Membership ended before the message could be accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms/{roomId}/events:
    get:
      operationId: streamAccountRoomEvents
      tags: [rooms]
      security: [{ AccountSession: [], AccountRoomSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RoomSessionHeader"
      responses:
        "200":
          description: Authenticated room.snapshot and chat.accepted SSE events; each reconnect rehydrates history
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "503": { $ref: "#/components/responses/CapacityError" }
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room and join as its first participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateInput"
      responses:
        "201":
          description: Room created with the creator's active participant session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/CapacityError"
        "409":
          description: Name is reserved by a registered account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room and its active participants
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room as a new participant session
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomJoinInput"
      responses:
        "201":
          description: Participant joined the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Room participant capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/participants/{sessionId}/heartbeat:
    post:
      operationId: heartbeatParticipant
      tags: [rooms]
      summary: Keep a participant session active
      description: Send periodically; participant sessions expire after 90 seconds without a heartbeat.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "200":
          description: Participant session remains active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "404":
          description: Room or active participant session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/participants/{sessionId}:
    delete:
      operationId: leaveRoom
      tags: [rooms]
      summary: End a participant session
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "204":
          description: Participant session ended
        "404":
          description: Room or active participant session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/events:
    get:
      operationId: streamRoomEvents
      tags: [rooms]
      summary: Subscribe to live room participant snapshots
      description: Opens a server-sent event stream. Sends a room.snapshot event immediately and whenever room membership changes.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/CapacityError"
        "200":
          description: Server-sent room.snapshot events containing the current RoomState
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/audio/events:
    get:
      operationId: streamAudioEvents
      tags: [audio]
      summary: Connect or reconnect a participant's WebRTC signaling stream
      description: Authenticates an existing active room session. Sends audio.ready, audio.peers, audio.signal, and audio.ended events. A new stream replaces an old stream for the same session without changing room membership.
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Authenticated server-sent signaling events
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "503":
          $ref: "#/components/responses/CapacityError"
  /rooms/{roomId}/audio/signals:
    post:
      operationId: sendAudioSignal
      tags: [audio]
      summary: Deliver an SDP offer or answer to one active audio peer in this room
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSignalInput"
      responses:
        "204":
          description: Delivered to the target's current signaling connection
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "404":
          description: Target is not an audio peer in this room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Stale connection generation or invalid negotiation direction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Signaling rate limit exceeded for this connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms/{roomId}/audio/connections/{connectionId}:
    delete:
      operationId: disconnectAudio
      tags: [audio]
      summary: Disconnect only this participant's audio, leaving room membership intact
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Connection closed, or already disconnected; stale generations cannot close a replacement
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
  /rooms/{roomId}/participants/{participantId}/microphone:
    put:
      operationId: controlRoomMicrophone
      tags: [audio]
      summary: Mute your own mic, or as creator mute or request to unmute another participant
      description: A creator cannot remotely activate someone else's microphone. The recipient must explicitly accept an unmute request and grant browser microphone permission.
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: participantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicrophoneAction" }
      responses:
        "200":
          description: Updated room state, also broadcast to room subscribers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403":
          description: Only the creator may moderate another mic; unmute requires its owner's explicit action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Room or participant no longer present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    AccountRoomSession:
      type: apiKey
      in: header
      name: X-Room-Session
      description: Private participant session, checked against the signed-in account and room
    AccountSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk-managed account session cookie; separate from private participant capabilities
    ParticipantSession:
      type: http
      scheme: bearer
      bearerFormat: Private participantSessionId returned by room creation or join
  responses:
    SessionUnauthorized:
      description: Missing, invalid, expired, or wrong-room private participant session credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvalidInput:
      description: Invalid room or session ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CapacityError:
      description: Service or event subscriber capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    RoomSessionHeader:
      name: X-Room-Session
      in: header
      required: true
      description: Private participant session; must belong to the authenticated account in this room
      schema: { type: string, format: uuid }
    RoomId:
      name: roomId
      in: path
      required: true
      description: Case-insensitive six-character Beam code or legacy 12-character room code
      schema:
        type: string
        pattern: "^([A-Za-z0-9]{6}|[A-Fa-f0-9]{12})$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    LiveStreamId:
      name: streamId
      in: path
      required: true
      schema:
        type: string
        pattern: "^[a-f0-9]{32}$"
  schemas:
    PinkCardWinner:
      type: object
      required: [id, name, prizeName, drawnAt]
      properties:
        id: { type: string }
        name: { type: string }
        prizeName: { type: string }
        drawnAt: { type: string }
    PinkCardReward:
