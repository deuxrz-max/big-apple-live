openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room and active participant session management
  - name: audio
    description: Authenticated room-scoped WebRTC signaling; media travels peer-to-peer
paths:
  /account/chat/photo-reviews:
    get:
      operationId: getPhotoReviewQueue
      responses:
        "200":
          description: Pending photos, accessible only to adult moderators
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PhotoReviewEntry" } }
  /account/chat/photo-reviews/{photoId}:
    patch:
      operationId: reviewProfilePhoto
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: Human review recorded without deleting the image or account
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [approved, rejected] }
  /me/photo:
    post:
      operationId: uploadProfilePhoto
      summary: Validate and stage an account-owned profile photo
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Persistent photo ready to save with the profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoResult" }
        "400": { description: Invalid or undecodable image }
        "401": { description: Sign in required }
        "413": { description: File exceeds five MiB }
        "429": { description: Upload rate exceeded }
  /photos/{photoId}:
    get:
      operationId: getProfilePhoto
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Validated metadata-free WebP image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "404": { description: Photo not available }
  /account/rooms/{roomId}/history/{beforeId}:
    get:
      operationId: getOlderRoomMessages
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: beforeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Older persisted messages from this membership's exact history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
  /account/chat/rooms:
    get:
      operationId: getChatDirectory
      responses:
        "200":
          description: Independent text-chat communities, not broadcast integrations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatDirectoryRoom" } }
  /account/chat/access:
    get:
      operationId: getChatAccess
      responses:
        "200":
          description: Server-side adult attestation and moderation access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccess" }
    post:
      operationId: confirmChatAdult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultAttestationInput" }
      responses:
        "200":
          description: Adult attestation saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccess" }
  /account/chat/reports:
    post:
      operationId: reportChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportInput" }
      responses:
        "201":
          description: Report queued for a We Buggin moderator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReportReceipt" }
    get:
      operationId: getChatReports
      responses:
        "200":
          description: Restricted moderator queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatReportRecord" } }
  /account/chat/reports/{reportId}:
    patch:
      operationId: reviewChatReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportReviewInput" }
      responses:
        "200":
          description: Report reviewed without deleting the underlying message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReportReceipt" }
  /social/me:
    $ref: './social.openapi.json#/paths/~1social~1me'
  /social/people:
    $ref: './social.openapi.json#/paths/~1social~1people'
  /social/people/{username}:
    $ref: './social.openapi.json#/paths/~1social~1people~1{username}'
  /social/people/{username}/relationship:
    $ref: './social.openapi.json#/paths/~1social~1people~1{username}~1relationship'
  /social/blocks:
    $ref: './social.openapi.json#/paths/~1social~1blocks'
  /social/wallet/claim:
    $ref: './social.openapi.json#/paths/~1social~1wallet~1claim'
  /social/gifts:
    $ref: './social.openapi.json#/paths/~1social~1gifts'
  /social/store/purchase:
    $ref: './social.openapi.json#/paths/~1social~1store~1purchase'
  /social/wallet/transactions:
    $ref: './social.openapi.json#/paths/~1social~1wallet~1transactions'
  /social/leaderboard:
    $ref: './social.openapi.json#/paths/~1social~1leaderboard'
  /social/messages:
    $ref: './social.openapi.json#/paths/~1social~1messages'
  /social/messages/{username}:
    $ref: './social.openapi.json#/paths/~1social~1messages~1{username}'
  /me:
    get:
      operationId: getMyProfile
      tags: [identity]
      security: [{ AccountSession: [] }]
      responses:
        "200":
          description: Saved account identity or null before onboarding
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileEnvelope" }
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
    put:
      operationId: saveMyProfile
      tags: [identity]
      security: [{ AccountSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved dedicated name and identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccountProfile" }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "409":
          description: Dedicated name already taken or cannot be renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /emojis:
    get:
      operationId: getEmojiCatalog
      tags: [identity]
      responses:
        "200":
          description: OpenMoji emoji library, with searchable names and categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EmojiOption" }
  /emojis/{emojiId}/{color}/image:
    get:
      operationId: getEmojiImage
      tags: [identity]
      parameters:
        - name: emojiId
          in: path
          required: true
          schema: { type: string }
        - name: color
          in: path
          required: true
          schema: { type: string, pattern: "^[0-9a-fA-F]{6}$" }
      responses:
        "200":
          description: Static library SVG with custom color, never driven by audio
          content:
            image/svg+xml:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "404":
          description: Unknown emoji
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms:
    post:
      operationId: createAccountRoom
      tags: [identity, rooms]
      security: [{ AccountSession: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccountRoomInput" }
      responses:
        "201":
          description: Room joined using the authenticated account's saved identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSession" }
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "409":
          description: Complete identity signup before joining
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms/{roomId}/join:
    post:
      operationId: joinAccountRoom
      tags: [identity, rooms]
      security: [{ AccountSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "201":
          description: Participant joined using their own saved account identity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomSession" }
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "404":
          description: Room not found
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Profile incomplete or room full
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /account/rooms/{roomId}/messages:
    get:
      operationId: getRoomMessages
      tags: [rooms]
      security: [{ AccountSession: [], AccountRoomSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RoomSessionHeader"
      responses:
        "200":
          description: Last 60 accepted messages, ordered oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ChatMessage" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
    post:
      operationId: sendRoomMessage
      tags: [rooms]
      security: [{ AccountSession: [], AccountRoomSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RoomSessionHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatInput" }
      responses:
        "201":
          description: Accepted message and authoritative sender profile, committed together
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccepted" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Membership ended before the message could be accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms/{roomId}/events:
    get:
      operationId: streamAccountRoomEvents
      tags: [rooms]
      security: [{ AccountSession: [], AccountRoomSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/RoomSessionHeader"
      responses:
        "200":
          description: Authenticated room.snapshot and chat.accepted SSE events; each reconnect rehydrates history
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "503": { $ref: "#/components/responses/CapacityError" }
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room and join as its first participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateInput"
      responses:
        "201":
          description: Room created with the creator's active participant session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/CapacityError"
        "409":
          description: Name is reserved by a registered account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room and its active participants
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room as a new participant session
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomJoinInput"
      responses:
        "201":
          description: Participant joined the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Room participant capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/participants/{sessionId}/heartbeat:
    post:
      operationId: heartbeatParticipant
      tags: [rooms]
      summary: Keep a participant session active
      description: Send periodically; participant sessions expire after 90 seconds without a heartbeat.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "200":
          description: Participant session remains active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "404":
          description: Room or active participant session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/participants/{sessionId}:
    delete:
      operationId: leaveRoom
      tags: [rooms]
      summary: End a participant session
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "204":
          description: Participant session ended
        "404":
          description: Room or active participant session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/events:
    get:
      operationId: streamRoomEvents
      tags: [rooms]
      summary: Subscribe to live room participant snapshots
      description: Opens a server-sent event stream. Sends a room.snapshot event immediately and whenever room membership changes.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/CapacityError"
        "200":
          description: Server-sent room.snapshot events containing the current RoomState
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/audio/events:
    get:
      operationId: streamAudioEvents
      tags: [audio]
      summary: Connect or reconnect a participant's WebRTC signaling stream
      description: Authenticates an existing active room session. Sends audio.ready, audio.peers, audio.signal, and audio.ended events. A new stream replaces an old stream for the same session without changing room membership.
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Authenticated server-sent signaling events
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "503":
          $ref: "#/components/responses/CapacityError"
  /rooms/{roomId}/audio/signals:
    post:
      operationId: sendAudioSignal
      tags: [audio]
      summary: Deliver an SDP offer or answer to one active audio peer in this room
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSignalInput"
      responses:
        "204":
          description: Delivered to the target's current signaling connection
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "404":
          description: Target is not an audio peer in this room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Stale connection generation or invalid negotiation direction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Signaling rate limit exceeded for this connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms/{roomId}/audio/connections/{connectionId}:
    delete:
      operationId: disconnectAudio
      tags: [audio]
      summary: Disconnect only this participant's audio, leaving room membership intact
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Connection closed, or already disconnected; stale generations cannot close a replacement
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
  /rooms/{roomId}/participants/{participantId}/microphone:
    put:
      operationId: controlRoomMicrophone
      tags: [audio]
      summary: Mute your own mic, or as creator mute or request to unmute another participant
      description: A creator cannot remotely activate someone else's microphone. The recipient must explicitly accept an unmute request and grant browser microphone permission.
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: participantId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MicrophoneAction" }
      responses:
        "200":
          description: Updated room state, also broadcast to room subscribers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RoomState" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403":
          description: Only the creator may moderate another mic; unmute requires its owner's explicit action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "404":
          description: Room or participant no longer present
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
components:
  securitySchemes:
    AccountRoomSession:
      type: apiKey
      in: header
      name: X-Room-Session
      description: Private participant session, checked against the signed-in account and room
    AccountSession:
      type: apiKey
      in: cookie
      name: __session
      description: Clerk-managed account session cookie; separate from private participant capabilities
    ParticipantSession:
      type: http
      scheme: bearer
      bearerFormat: Private participantSessionId returned by room creation or join
  responses:
    SessionUnauthorized:
      description: Missing, invalid, expired, or wrong-room private participant session credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvalidInput:
      description: Invalid room or session ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CapacityError:
      description: Service or event subscriber capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    RoomSessionHeader:
      name: X-Room-Session
      in: header
      required: true
      description: Private participant session; must belong to the authenticated account in this room
      schema: { type: string, format: uuid }
    RoomId:
      name: roomId
      in: path
      required: true
      description: Case-insensitive six-character Beam code or legacy 12-character room code
      schema:
        type: string
        pattern: "^([A-Za-z0-9]{6}|[A-Fa-f0-9]{12})$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    PhotoReviewEntry:
      type: object
      required: [id, photoUrl, status, createdAt]
      properties:
        id: { type: string }
        photoUrl: { type: string }
        status: { type: string, enum: [pending, approved, rejected, flagged] }
        username: { type: [string, "null"] }
        displayName: { type: [string, "null"] }
        createdAt: { type: string, format: date-time }
    PhotoReviewStatus:
      type: object
      required: [photoUrl, status]
      properties:
        photoUrl: { type: string }
        status: { type: string, enum: [pending, approved, rejected, flagged] }
    ChatDirectoryRoom:
      type: object
      required: [roomId, label]
      properties:
        roomId: { type: string }
        label: { type: string }
    CommunityAtmosphere:
      type: object
      required: [scene, since, activity, windowMs, sentimentEnabled]
      properties:
        scene: { type: string, enum: [city, calm, volcano] }
        since: { type: number }
        activity: { type: integer }
        windowMs: { type: integer }
        sentimentEnabled: { type: boolean }
    ChatAccess:
      type: object
      required: [adultConfirmed, moderator, sentimentEnabled, suspended]
      properties:
        adultConfirmed: { type: boolean }
        moderator: { type: boolean }
        sentimentEnabled: { type: boolean }
        suspended: { type: boolean }
    AdultAttestationInput:
      type: object
      required: [adult]
      properties:
        adult: { type: boolean, enum: [true] }
    ChatReportInput:
      type: object
      required: [roomId, messageId, reason]
      properties:
        roomId: { type: string }
        messageId: { type: string, format: uuid }
        reason: { type: string, enum: [harassment, minor, spam, other] }
        details: { type: string, maxLength: 500 }
    ChatReportReceipt:
      type: object
      required: [id, status]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, dismissed, hidden, muted, restricted] }
    ChatReportRecord:
      allOf:
        - $ref: "#/components/schemas/ChatReportReceipt"
        - type: object
          required: [roomId, messageId, reason, details, text, username, createdAt]
          properties:
            roomId: { type: string }
            messageId: { type: string, format: uuid }
            reason: { type: string }
            details: { type: string }
            text: { type: string }
            username: { type: string }
            createdAt: { type: string, format: date-time }
    ChatReportReviewInput:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [dismiss, hide, mute, restrict] }
    MicrophoneAction:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action: { type: string, enum: [mute, unmute, request-unmute] }
    AccountRoomInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 32 }
        capacity: { type: integer, enum: [2, 4, 9, 12] }
      required: [name, capacity]
    ChatInput:
      type: object
      additionalProperties: false
      properties:
        text: { type: string, minLength: 1, maxLength: 280 }
        kind: { type: string, enum: [text, reaction] }
      required: [text, kind]
    ChatMessage:
      type: object
      properties:
        id: { type: string, format: uuid }
        roomId: { type: string }
        authorId: { type: string, format: uuid }
        username: { type: string }
        photoUrl: { type: [string, "null"] }
        identity: { $ref: "#/components/schemas/EmojiIdentity" }
        kind: { type: string, enum: [text, reaction] }
        text: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, roomId, authorId, username, identity, kind, text, createdAt]
    ChatAccepted:
      type: object
      properties:
        message: { $ref: "#/components/schemas/ChatMessage" }
        profile: { $ref: "#/components/schemas/AccountProfile" }
      required: [message, profile]
    EmojiIdentity:
      type: object
      properties:
        emojiId: { type: string, minLength: 1, maxLength: 100 }
        gender: { type: string, enum: [Male, Female] }
        color: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        hairColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        portraitId:
          type: [string, "null"]
          description: Omitted preserves old artwork; null clears it on explicit manual identity edits
        currentMood:
          type: [string, "null"]
          enum: [laughing, tears_of_joy, crying, rofl, heart_eyes, affectionate, melting, grateful, thinking, winking, neutral, smiling_eyes, delighted, grinning, smiling, kissing, playful_wink, skeptical, null]
      required: [emojiId, gender, color, hairColor]
    EmojiOption:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        group: { type: string }
        unicode: { type: string }
      required: [id, name, group, unicode]
    ProfileInput:
      type: object
      additionalProperties: false
      properties:
        username:
          type: string
          pattern: "^[A-Za-z0-9_]{3,24}$"
        identity: { $ref: "#/components/schemas/EmojiIdentity" }
        displayName: { type: string, minLength: 1, maxLength: 40 }
        bio: { type: string, maxLength: 280 }
        photoUrl: { type: [string, "null"], maxLength: 200 }
        photoUrls:
          type: array
          maxItems: 4
          uniqueItems: true
          items: { type: string, maxLength: 200 }
      required: [username]
    AccountProfile:
      type: object
      properties:
        username: { type: string }
        displayName: { type: string }
        bio: { type: string }
        photoUrl: { type: [string, "null"] }
        photoReviews:
          type: array
          items: { $ref: "#/components/schemas/PhotoReviewStatus" }
        photoUrls:
          type: array
          maxItems: 4
          items: { type: string }
        identity: { $ref: "#/components/schemas/EmojiIdentity" }
        updatedAt: { type: string, format: date-time }
      required: [username, identity, updatedAt]
    ProfilePhotoResult:
      type: object
      properties:
        photoUrl: { type: string }
      required: [photoUrl]
    ProfileEnvelope:
      type: object
      properties:
        profile:
          anyOf:
            - $ref: "#/components/schemas/AccountProfile"
            - type: "null"
      required: [profile]
    AudioDescription:
      type: object
      properties:
        type:
          type: string
          enum: [offer, answer]
        sdp:
          type: string
          minLength: 1
          maxLength: 12000
      required: [type, sdp]
    AudioSignalInput:
      type: object
      properties:
        sourceConnectionId:
          type: string
          format: uuid
        targetParticipantId:
          type: string
          format: uuid
        targetConnectionId:
          type: string
          format: uuid
        description:
          $ref: "#/components/schemas/AudioDescription"
      required: [sourceConnectionId, targetParticipantId, targetConnectionId, description]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoomCreateInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
      required: [displayName]
    RoomJoinInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
      required: [displayName]
    Participant:
      type: object
      properties:
        micEnabled: { type: boolean }
        hostMuted: { type: boolean }
        unmuteRequested: { type: boolean }
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        photoUrl: { type: [string, "null"] }
        joinedAt:
          type: string
          format: date-time
        identity:
          anyOf:
            - $ref: "#/components/schemas/EmojiIdentity"
            - type: "null"
        isRegistered: { type: boolean }
      required: [participantId, displayName, joinedAt, identity, isRegistered, micEnabled, hostMuted, unmuteRequested]
    RoomState:
      type: object
      properties:
        communityAtmosphere: { $ref: "#/components/schemas/CommunityAtmosphere" }
        hostParticipantId: { type: string, format: uuid }
        name: { type: string }
        capacity: { type: integer }
        roomId:
          type: string
        createdAt:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
      required: [roomId, createdAt, participants, name, capacity, hostParticipantId]
    RoomSession:
      type: object
      properties:
        participantSessionId:
          type: string
          format: uuid
        participantId:
          type: string
          format: uuid
        room:
          $ref: "#/components/schemas/RoomState"
      required: [participantSessionId, participantId, room]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

