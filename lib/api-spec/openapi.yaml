      required: [cycle, serverTime, winner]
      properties:
        cycle: { type: string }
        serverTime: { type: string }
        winner:
          anyOf:
            - { $ref: "#/components/schemas/PinkCardWinner" }
            - { type: "null" }
    PinkCardEntry:
      type: object
      required: [entered, optedOut]
      properties:
        entered: { type: boolean }
        optedOut: { type: boolean }
    PinkCardPreference:
      type: object
      required: [optedOut]
      properties:
        optedOut: { type: boolean }
    FavoriteRoom:
      type: object
      required: [roomId, label]
      properties:
        roomId: { type: string }
        label: { type: string }
    FavoriteRoomResult:
      type: object
      required: [room]
      properties:
        room:
          anyOf:
            - { $ref: "#/components/schemas/FavoriteRoom" }
            - { type: "null" }
    FavoriteGalleryEntry:
      type: object
      required: [person, room]
      properties:
        person: { $ref: "./social.openapi.json#/components/schemas/SocialPerson" }
        room:
          anyOf:
            - { $ref: "#/components/schemas/FavoriteRoom" }
            - { type: "null" }
    UniversityActionResult:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    UniversityIgnoreInput:
      type: object
      required: [active]
      properties:
        active: { type: boolean }
    UniversityWhisperInput:
      type: object
      required: [username, body, idempotencyKey]
      properties:
        username: { type: string }
        body: { type: string, minLength: 1, maxLength: 1000 }
        idempotencyKey: { type: string, format: uuid }
    UniversityPerson:
      type: object
      required: [participantId, username, displayName, photoUrl, photoStatus, self, moderator, ignored, blocked]
      properties:
        botId: { type: [string, "null"], enum: [ghost, vampire, wolf, zombie, null] }
        badgeId: { type: [string, "null"] }
        badgeName: { type: [string, "null"] }
        badgeImage: { type: [string, "null"] }
        participantId: { type: string }
        username: { type: string }
        displayName: { type: string }
        displayNameColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$" }
        displayNameTierIndex: { type: integer, minimum: 0, maximum: 100 }
        passport: { $ref: "./social.openapi.json#/components/schemas/StreamerPassportBadgeSummary" }
        identity: { $ref: "#/components/schemas/EmojiIdentity" }
        photoUrl: { type: [string, "null"] }
        photoStatus: { type: [string, "null"] }
