openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room and active participant session management
  - name: audio
    description: Authenticated room-scoped WebRTC signaling; media travels peer-to-peer
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /rooms:
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room and join as its first participant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomCreateInput"
      responses:
        "201":
          description: Room created with the creator's active participant session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          $ref: "#/components/responses/CapacityError"
  /rooms/{roomId}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room and its active participants
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "200":
          description: Current room state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomState"
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/join:
    post:
      operationId: joinRoom
      tags: [rooms]
      summary: Join a room as a new participant session
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomJoinInput"
      responses:
        "201":
          description: Participant joined the room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoomSession"
        "400":
          description: Invalid participant details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Room participant capacity reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/participants/{sessionId}/heartbeat:
    post:
      operationId: heartbeatParticipant
      tags: [rooms]
      summary: Keep a participant session active
      description: Send periodically; participant sessions expire after 90 seconds without a heartbeat.
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "200":
          description: Participant session remains active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Participant"
        "404":
          description: Room or active participant session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/participants/{sessionId}:
    delete:
      operationId: leaveRoom
      tags: [rooms]
      summary: End a participant session
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - $ref: "#/components/parameters/SessionId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "204":
          description: Participant session ended
        "404":
          description: Room or active participant session not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/events:
    get:
      operationId: streamRoomEvents
      tags: [rooms]
      summary: Subscribe to live room participant snapshots
      description: Opens a server-sent event stream. Sends a room.snapshot event immediately and whenever room membership changes.
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "400":
          $ref: "#/components/responses/InvalidInput"
        "503":
          $ref: "#/components/responses/CapacityError"
        "200":
          description: Server-sent room.snapshot events containing the current RoomState
          content:
            text/event-stream:
              schema:
                type: string
        "404":
          description: Room not found or expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /rooms/{roomId}/audio/events:
    get:
      operationId: streamAudioEvents
      tags: [audio]
      summary: Connect or reconnect a participant's WebRTC signaling stream
      description: Authenticates an existing active room session. Sends audio.ready, audio.peers, audio.signal, and audio.ended events. A new stream replaces an old stream for the same session without changing room membership.
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      responses:
        "200":
          description: Authenticated server-sent signaling events
          content:
            text/event-stream:
              schema: { type: string }
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "503":
          $ref: "#/components/responses/CapacityError"
  /rooms/{roomId}/audio/signals:
    post:
      operationId: sendAudioSignal
      tags: [audio]
      summary: Deliver an SDP offer or answer to one active audio peer in this room
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSignalInput"
      responses:
        "204":
          description: Delivered to the target's current signaling connection
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
        "404":
          description: Target is not an audio peer in this room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: Stale connection generation or invalid negotiation direction
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "429":
          description: Signaling rate limit exceeded for this connection
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /rooms/{roomId}/audio/connections/{connectionId}:
    delete:
      operationId: disconnectAudio
      tags: [audio]
      summary: Disconnect only this participant's audio, leaving room membership intact
      security: [{ ParticipantSession: [] }]
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Connection closed, or already disconnected; stale generations cannot close a replacement
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/SessionUnauthorized"
components:
  securitySchemes:
    ParticipantSession:
      type: http
      scheme: bearer
      bearerFormat: Private participantSessionId returned by room creation or join
  responses:
    SessionUnauthorized:
      description: Missing, invalid, expired, or wrong-room private participant session credential
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorResponse" }
    InvalidInput:
      description: Invalid room or session ID
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    CapacityError:
      description: Service or event subscriber capacity reached
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  parameters:
    RoomId:
      name: roomId
      in: path
      required: true
      description: Case-insensitive 12-character room code
      schema:
        type: string
        pattern: "^[A-Fa-f0-9]{12}$"
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AudioDescription:
      type: object
      properties:
        type:
          type: string
          enum: [offer, answer]
        sdp:
          type: string
          minLength: 1
          maxLength: 12000
      required: [type, sdp]
    AudioSignalInput:
      type: object
      properties:
        sourceConnectionId:
          type: string
          format: uuid
        targetParticipantId:
          type: string
          format: uuid
        targetConnectionId:
          type: string
          format: uuid
        description:
          $ref: "#/components/schemas/AudioDescription"
      required: [sourceConnectionId, targetParticipantId, targetConnectionId, description]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RoomCreateInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
      required: [displayName]
    RoomJoinInput:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 40
      required: [displayName]
    Participant:
      type: object
      properties:
        participantId:
          type: string
          format: uuid
        displayName:
          type: string
        joinedAt:
          type: string
          format: date-time
      required: [participantId, displayName, joinedAt]
    RoomState:
      type: object
      properties:
        roomId:
          type: string
        createdAt:
          type: string
          format: date-time
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
      required: [roomId, createdAt, participants]
    RoomSession:
      type: object
      properties:
        participantSessionId:
          type: string
          format: uuid
        room:
          $ref: "#/components/schemas/RoomState"
      required: [participantSessionId, room]
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

