openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: rooms
    description: Room and active participant session management
  - name: audio
    description: Authenticated room-scoped WebRTC signaling; media travels peer-to-peer
  - name: video
    description: Authenticated university video beam management and LiveKit access
paths:
  /rewards/pink-card:
    get:
      operationId: getPinkCardReward
      responses:
        "200":
          description: Latest public pink-card draw, never future draw times
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinkCardReward" }
  /social/pink-card/entry:
    get:
      operationId: getPinkCardEntry
      responses:
        "200":
          description: Current daily reward entry
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinkCardEntry" }
    put:
      operationId: updatePinkCardEntry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PinkCardPreference" }
      responses:
        "200":
          description: Updated opt-out preference
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PinkCardEntry" }
  /account/chat/bots/settings:
    get:
      operationId: getModeratorBotSettings
      responses:
        "200":
          description: Moderator-only filter and rotation settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorBotSettings" }
    put:
      operationId: saveModeratorBotSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeratorBotSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorBotSettings" }
  /account/chat/bots/chatter:
    get:
      operationId: getModeratorBotChatterSettings
      responses:
        "200":
          description: Moderator-only bot chatter settings and editable profiles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorBotChatterSettings" }
    put:
      operationId: saveModeratorBotChatterSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModeratorBotChatterSettings" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorBotChatterSettings" }
  /account/chat/bots/flags:
    get:
      operationId: getModeratorBotFlags
      responses:
        "200":
          description: Moderator-only hidden public messages
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ModeratorBotFlag" }
  /account/chat/bots/flags/{flagId}/review:
    post:
      operationId: acknowledgeModeratorBotFlag
      parameters:
        - in: path
          name: flagId
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Reviewed; message stays hidden
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ModeratorBotFlag" }
  /social/favorites/gallery:
    get:
      operationId: getFavoritesGallery
      responses:
        "200":
          description: All favorites visible to this account, with live university presence
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FavoriteGalleryEntry" }
  /social/favorites/{username}/room:
    get:
      operationId: getFavoriteRoom
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Fresh live presence, only for an unblocked favorite
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FavoriteRoomResult" }
  /account/rooms/{roomId}/university-session:
    get:
      operationId: getUniversitySession
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Viewer-specific people and whispers; requires X-Room-Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversitySession" }
  /account/rooms/{roomId}/audio:
    get:
      operationId: getUniversityAudioState
      tags: [audio]
      summary: Read the four-slot audio beam state for an authenticated university member
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      responses:
        "200":
          description: Current speaker slots and beam host; no audio is returned by this endpoint
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityAudioState" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "404": { $ref: "#/components/responses/InvalidInput" }
  /account/rooms/{roomId}/video-beam:
    get:
      operationId: getUniversityVideoBeamState
      tags: [video]
      summary: Read the nine-seat LiveKit video beam for an authenticated room member
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      responses:
        "200":
          description: Current speaker slots and beam host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamState" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "404": { $ref: "#/components/responses/InvalidInput" }
        "503": { description: LiveKit credentials are unavailable or the room service cannot be reached }
  /account/rooms/{roomId}/video-beam/token:
    post:
      operationId: getUniversityVideoBeamToken
      tags: [video]
      summary: Issue a short-lived, room-scoped LiveKit token to an authenticated university member
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityVideoBeamTokenInput" }
      responses:
        "200":
          description: Short-lived token; LiveKit API secrets are never returned
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamToken" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "409": { description: No open speaker slot is available or the member was recently removed }
        "503": { description: LiveKit credentials are unavailable or the room service cannot be reached }
  /account/rooms/{roomId}/video-beam/actions:
    post:
      operationId: performUniversityVideoBeamAction
      tags: [video]
      summary: Leave a speaker slot or apply consent-based self and host controls
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityVideoBeamActionInput" }
      responses:
        "200":
          description: Updated beam state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamState" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403":
          description: "Only the host may control another participant, and a host cannot enable another participant's media"
        "404": { description: The selected participant is not on the beam }
        "503": { description: LiveKit room control is unavailable }
  /account/live-streams:
    get:
      operationId: getLiveStreams
      tags: [video]
      summary: List active independent camera livestreams
      security:
        - AccountSession: []
      responses:
        "200":
          description: Active creator livestreams and current audience counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamList" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "503": { description: LiveKit room service is unavailable }
    post:
      operationId: startLiveStream
      tags: [video]
      summary: Start a separate camera livestream for the signed-in account
      security:
        - AccountSession: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveStreamStartInput" }
      responses:
        "200":
          description: Short-lived host token for an independent LiveKit room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamHostSession" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "409": { description: A room microphone is active or this account is already live }
        "503": { description: LiveKit room service is unavailable }
  /account/live-streams/{streamId}/heartbeat:
    post:
      operationId: heartbeatLiveStream
      tags: [video]
      summary: Keep the signed-in creator livestream active
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Lease renewed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamHeartbeat" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "404": { description: Livestream is no longer active }
  /account/live-streams/{streamId}/end:
    post:
      operationId: beaconEndLiveStream
      tags: [video]
      summary: End the creator livestream during page navigation or close
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Stream ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamEnded" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Only the stream owner may end this livestream }
  /account/live-streams/{streamId}/token:
    post:
      operationId: joinLiveStream
      tags: [video]
      summary: Join an active camera livestream as a viewer
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Short-lived subscribe-only LiveKit token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamViewerSession" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "404": { description: Livestream is no longer active }
        "503": { description: LiveKit room service is unavailable }
  /account/live-streams/{streamId}/rejoin:
    post:
      operationId: rejoinLiveStream
      tags: [video]
      summary: Rejoin the signed-in creator's active camera livestream
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Host token for the creator's existing live room
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamHostSession" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Only the creator can rejoin this livestream }
        "404": { description: Livestream is no longer active }
  /account/live-streams/{streamId}/chat/events:
    get:
      operationId: streamLiveStreamChat
      tags: [video]
      summary: Receive block-filtered chat for a live camera stream
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Server-filtered chat event stream
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Account is not an active viewer or speaker }
        "404": { description: Livestream is no longer active }
  /account/live-streams/{streamId}/chat:
    post:
      operationId: sendLiveStreamChatMessage
      tags: [video]
      summary: Send a moderated live camera stream chat message
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LiveStreamChatInput" }
      responses:
        "201":
          description: Message accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamChatMessage" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: "Chat may be muted, account access may be restricted, or caller may not be in the stream" }
        "404": { description: Livestream is no longer active }
  /account/live-streams/{streamId}/pk/search:
    post:
      operationId: searchPkOpponent
      tags: [video]
      summary: Search for a random live broadcaster for a one-on-one PK battle
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Current search or matched battle state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkBattleState" }
        "403": { description: Only the active broadcaster may start matchmaking }
        "409": { description: The broadcaster is already searching or in a battle }
    delete:
      operationId: cancelPkOpponentSearch
      tags: [video]
      summary: Cancel an active PK opponent search
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Search cancellation result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkSearchCancellation" }
        "403": { description: Only the broadcaster may cancel this search }
  /account/live-streams/{streamId}/pk/state:
    get:
      operationId: getPkBattleState
      tags: [video]
      summary: Read PK matchmaking, battle timer, score and top gifters
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Current PK state for the live broadcast
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkBattleState" }
        "403": { description: Join the live stream before reading its PK battle }
        "404": { description: Livestream is no longer active }
  /account/live-streams/{streamId}/pk/session:
    post:
      operationId: joinPkBattleMedia
      tags: [video]
      summary: Join the shared split-screen LiveKit room for an active PK battle
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Publisher token for battle broadcasters or subscriber token for viewers
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkBattleMediaSession" }
        "403": { description: Join the source livestream before joining its PK media room }
        "404": { description: No active PK battle is available }
  /social/pk/leaderboard:
    get:
      operationId: getPkLeaderboard
      tags: [social]
      summary: Get weekly broadcaster PK wins and longest win streak
      security:
        - AccountSession: []
      responses:
        "200":
          description: Weekly PK leaderboard (Monday 3 AM Eastern reset)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PkLeaderboard" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
  /account/live-streams/{streamId}:
    delete:
      operationId: endLiveStream
      tags: [video]
      summary: End the signed-in account's camera livestream
      security:
        - AccountSession: []
      parameters:
        - { $ref: "#/components/parameters/LiveStreamId" }
      responses:
        "200":
          description: Stream ended
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LiveStreamEnded" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Only the stream owner may end this livestream }
        "503": { description: LiveKit room service is unavailable }
  /account/rooms/{roomId}/video-beam/tv:
    get:
      operationId: getUniversityVideoBeamTvState
      tags: [video]
      summary: Read the room-synchronized Beam TV state
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      responses:
        "200":
          description: Current TV source and synchronized playback state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamTvState" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "404": { $ref: "#/components/responses/InvalidInput" }
    post:
      operationId: performUniversityVideoBeamTvAction
      tags: [video]
      summary: Configure Beam TV or synchronize playback as the current beam host
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityVideoBeamTvActionInput" }
      responses:
        "200":
          description: Updated room TV state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamTvState" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Only the current beam host can control Beam TV }
        "404": { description: Room or beam not found }
  /account/rooms/{roomId}/video-beam/tv/search:
    post:
      operationId: searchYouTubeForVideoBeam
      tags: [video]
      summary: Search embeddable YouTube videos for the beam host
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityVideoBeamTvSearchInput" }
      responses:
        "200":
          description: Cached or newly fetched queue of embeddable video IDs
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamTvSearchResponse" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Only the current beam host can search for Beam TV videos }
        "503": { description: YouTube search is unavailable without YOUTUBE_API_KEY }
  /account/rooms/{roomId}/video-beam/tv/comedy/catalog:
    get:
      operationId: getComedyRoomVideoCatalog
      tags: [video]
      summary: List screened Comedy room videos from its configured sources
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      responses:
        "200":
          description: Cached room-safe videos with source labels
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ComedyVideoCatalogResponse" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Join the room before reading its video list }
        "404": { description: The video picker is only available in the Comedy room }
  /account/rooms/{roomId}/video-beam/tv/comedy/action:
    post:
      operationId: performComedyRoomVideoAction
      tags: [video]
      summary: Select a screened video or advance shared Comedy room playback
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ComedyVideoActionInput" }
      responses:
        "200":
          description: Updated room-synchronized TV state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityVideoBeamTvState" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403": { description: Join the room before selecting a video }
        "404": { description: The video or room is unavailable }
        "503": { description: The Comedy room video list is still loading }
  /account/rooms/{roomId}/audio/actions:
    post:
      operationId: performUniversityAudioAction
      tags: [audio]
      summary: Join, leave, or control an audio-only university beam
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityAudioActionInput" }
      responses:
        "200":
          description: Updated beam state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityAudioState" }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403":
          description: Only a current speaker may unmute themselves, and only the beam host may mute or remove another speaker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: All nine speaker slots are occupied, or the account was recently removed from this beam
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms/{roomId}/audio/events:
    get:
      operationId: streamUniversityAudioEvents
      tags: [audio]
      summary: Listen for audio-only beam peers and moderation state
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      responses:
        "200":
          description: Server-sent signaling events; media itself travels peer-to-peer
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "403":
          description: The account is temporarily blocked from this beam after being removed by its host
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
  /account/rooms/{roomId}/audio/signals:
    post:
      operationId: sendUniversityAudioSignal
      tags: [audio]
      summary: Relay peer-to-peer WebRTC descriptions and trickled ICE candidates between current university beam participants
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityAudioSignalInput" }
      responses:
        "204": { description: WebRTC description or ICE candidate delivered to the current peer }
        "400": { $ref: "#/components/responses/InvalidInput" }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
        "404": { description: Target is not a connected audio peer }
        "409": { description: Stale connection or invalid negotiation direction }
        "429": { description: Signaling rate limit exceeded }
  /account/rooms/{roomId}/audio/connections/{connectionId}:
    delete:
      operationId: disconnectUniversityAudio
      tags: [audio]
      summary: Disconnect this account's peer audio connection without leaving chat
      security:
        - AccountSession: []
          AccountRoomSession: []
      parameters:
        - { $ref: "#/components/parameters/RoomId" }
        - name: connectionId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/RoomSessionHeader" }
      responses:
        "204": { description: Connection closed or already gone }
        "401": { $ref: "#/components/responses/SessionUnauthorized" }
  /account/rooms/{roomId}/whispers:
    post:
      operationId: sendUniversityWhisper
      parameters:
        - { name: roomId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityWhisperInput" }
      responses:
        "201":
          description: Saved in the existing private conversation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityActionResult" }
  /account/chat/ignores/{username}:
    put:
      operationId: setUniversityIgnore
      parameters:
        - { name: username, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UniversityIgnoreInput" }
      responses:
        "200":
          description: Account-wide ignore saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityActionResult" }
  /account/chat/rules/seen:
    post:
      operationId: acknowledgeUniversityRules
      responses:
        "200":
          description: Rules acknowledged for this account
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UniversityActionResult" }
  /account/chat/photo-reviews:
    get:
      operationId: getPhotoReviewQueue
      responses:
        "200":
          description: Pending photos, accessible to adult moderators and the Deux Wild owner
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/PhotoReviewEntry" } }
  /account/chat/photo-reviews/{photoId}:
    patch:
      operationId: reviewProfilePhoto
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [approve, reject] }
      responses:
        "200":
          description: Human review recorded without deleting the image or account
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [approved, rejected] }
  /me/photo:
    post:
      operationId: uploadProfilePhoto
      summary: Validate and stage an account-owned profile photo
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Persistent photo ready to save with the profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfilePhotoResult" }
        "400": { description: Invalid or undecodable image }
        "401": { description: Sign in required }
        "413": { description: File exceeds five MiB }
        "429": { description: Upload rate exceeded }
  /photos/{photoId}:
    get:
      operationId: getProfilePhoto
      parameters:
        - name: photoId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Validated metadata-free WebP image
          content:
            image/webp:
              schema: { type: string, format: binary }
        "401": { description: Sign in required }
        "404": { description: Photo not available }
  /account/rooms/{roomId}/history/{beforeId}:
    get:
      operationId: getOlderRoomMessages
      parameters:
        - $ref: "#/components/parameters/RoomId"
        - name: beforeId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Older persisted messages from this membership's exact history
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatMessage" } }
  /account/chat/rooms:
    get:
      operationId: getChatDirectory
      responses:
        "200":
          description: Independent text-chat communities, not broadcast integrations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatDirectoryRoom" } }
  /account/chat/access:
    get:
      operationId: getChatAccess
      responses:
        "200":
          description: Server-side adult attestation and moderation access
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccess" }
    post:
      operationId: confirmChatAdult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AdultAttestationInput" }
      responses:
        "200":
          description: Adult attestation saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatAccess" }
  /account/chat/reports:
    post:
      operationId: reportChatMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportInput" }
      responses:
        "201":
          description: Report queued for a Deux Wild moderator
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReportReceipt" }
    get:
      operationId: getChatReports
      responses:
        "200":
          description: Restricted moderator queue
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ChatReportRecord" } }
  /account/chat/reports/{reportId}:
    patch:
      operationId: reviewChatReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChatReportReviewInput" }
      responses:
        "200":
          description: Report reviewed without deleting the underlying message
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChatReportReceipt" }
